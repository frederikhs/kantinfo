name: Docker
on:
  push:
    branches:
      - '**'

env:
  REGISTRY: ghcr.io
  VERSION: ${{ github.sha }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Build and push platform images
        uses: docker/bake-action@v7
        with:
          push: true
          targets: |
            backend
            frontend
          set: |
            *.platform=${{ matrix.platform }}
            backend.tags=${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.VERSION }}-${{ matrix.arch }}
            frontend.tags=${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.VERSION }}-${{ matrix.arch }}
            backend.cache-from=type=gha,scope=backend-${{ matrix.arch }},version=2
            backend.cache-to=type=gha,mode=max,scope=backend-${{ matrix.arch }},version=2
            frontend.cache-from=type=gha,scope=frontend-${{ matrix.arch }},version=2
            frontend.cache-to=type=gha,mode=max,scope=frontend-${{ matrix.arch }},version=2

  manifest:
    name: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - build

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Push multi-platform manifests
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.VERSION }}" \
            "${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.VERSION }}-amd64" \
            "${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.VERSION }}-arm64"

          docker buildx imagetools create \
            -t "${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.VERSION }}" \
            "${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.VERSION }}-amd64" \
            "${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.VERSION }}-arm64"

      - name: Inspect multi-platform manifests
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.VERSION }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.VERSION }}"
